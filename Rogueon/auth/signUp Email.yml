      value: http://localhost:5173
  body:
    type: json
    data: |-
      {
        "name": "Test Customer",
        "email": "customer2@example.com",
        "password": "StrongPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
