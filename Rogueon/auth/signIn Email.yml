info:
  name: signIn Email
  type: http
  seq: 3

http:
  method: POST
  url: "{{authBaseUrl}}/sign-in/email"
  headers:
    - name: Origin
      value: http://localhost:5173
  body:
    type: json
    data: |-
      {
        "email": "customer@example.com",
        "password": "StrongPassword123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
